[project]
name = "task-management"
version = "0.1.0"
description = "Итоговое домашнее задание: REST API для управления задачами."
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.30.0,<0.35",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29.0,<0.31",
    "alembic>=1.13.0,<1.15",
    "pydantic>=2.7.0,<2.11",
    "pydantic-settings>=2.3.0,<2.8",
    "email-validator>=2.1.0,<2.3",
    "python-jose[cryptography]>=3.3.0,<4.0",
    "bcrypt>=4.1.0,<5.0",
    "python-multipart>=0.0.9,<0.1",
    "redis>=5.0.0,<6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0,<9.0",
    "pytest-asyncio>=0.23.0,<1.0",
    "pytest-cov>=5.0.0,<6.0",
    "httpx>=0.27.0,<0.28",
    "testcontainers[postgres]>=4.5.0,<5.0",
    "ruff>=0.6.0,<0.12",
    "black>=24.4.0,<26.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]